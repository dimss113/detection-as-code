title: Logon with New Credentials via Seclogo (Pass-the-Hash)
id: 6f0c3e0a-8f6e-4a77-9c1a-2a5d1b7c0004
status: experimental
description: A logon type 9 through the seclogo process, the pattern left by tools that start a process with a stolen NTLM hash.
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: dimss113
date: 2026-10-31
tags:
  - attack.lateral-movement
  - attack.t1550.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 9
    LogonProcessName: 'seclogo'
    AuthenticationPackageName: 'Negotiate'
  condition: selection
falsepositives:
  - Admins using runas /netonly
level: high
