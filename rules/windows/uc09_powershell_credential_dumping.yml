title: PowerShell Script Block with Credential Dumping Functions
id: 6f0c3e0a-8f6e-4a77-9c1a-2a5d1b7c0009
status: experimental
description: A PowerShell script block references functions or modules used to dump credentials from memory.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1059/001/
author: dimss113
date: 2026-10-31
tags:
  - attack.credential-access
  - attack.t1003.001
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  selection:
    ScriptBlockText|contains:
      - 'MiniDumpWriteDump'
      - 'Invoke-Mimikatz'
      - 'sekurlsa::'
      - 'kerberos::'
  condition: selection
falsepositives:
  - Security training or red team scripts
level: high
